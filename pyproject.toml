[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dkcot-uk-stocks"
version = "0.1.0"
description = "Financial-news sentiment analysis for ten UK-listed companies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.5,<3",
    "transformers>=4.56,<5",
    "yfinance>=0.2",
]

[tool.setuptools.packages.find]
include = ["uk_dkcot*"]
